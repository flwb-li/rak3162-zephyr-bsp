CONFIG_USE_SEGGER_RTT=n

CONFIG_LOG=y
CONFIG_LOG_FUNC_NAME_PREFIX_ERR=n
CONFIG_LOG_FUNC_NAME_PREFIX_WRN=n
CONFIG_LOG_FUNC_NAME_PREFIX_INF=n
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BOOT_BANNER=n

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_ASYNC_API=y

CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_NRF_GRTC_TIMER=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
CONFIG_I2C=y
CONFIG_SPI=y

CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_HEAP_MEM_POOL_SIZE=8192
# LoRaMAC TimerIrqHandler -> MacProcessNotify -> LoRaMacProcess runs here
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_FAULT_DUMP=2

CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="rak3162_hw_test"

# Zephyr LoRa + LoRaWAN (loramac-node); default AT+BAND=4 (EU868)
# Multiple regions enabled so AT+BAND can select before lorawan_start().
# AS923-2/3/4 and LA915 are not available in Zephyr.
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAMAC_REGION_EU868=y
CONFIG_LORAMAC_REGION_EU433=y
CONFIG_LORAMAC_REGION_CN470=y
CONFIG_LORAMAC_REGION_RU864=y
CONFIG_LORAMAC_REGION_IN865=y
CONFIG_LORAMAC_REGION_US915=y
CONFIG_LORAMAC_REGION_AU915=y
CONFIG_LORAMAC_REGION_KR920=y
CONFIG_LORAMAC_REGION_AS923=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
