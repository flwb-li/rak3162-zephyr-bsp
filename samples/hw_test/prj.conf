CONFIG_USE_SEGGER_RTT=n

CONFIG_LOG=y
CONFIG_LOG_FUNC_NAME_PREFIX_ERR=n
CONFIG_LOG_FUNC_NAME_PREFIX_WRN=n
CONFIG_LOG_FUNC_NAME_PREFIX_INF=n
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=n
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BOOT_BANNER=n

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_ASYNC_API=y

CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_NRF_GRTC_TIMER=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_REGULATOR=y
CONFIG_I2C=y

# Match usp_zephyr ping_pong baseline: keep device PM only.
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

CONFIG_SPI=y

CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="rak3162_hw_test"

# Zephyr "lora" (loramac-node) off — P2P uses Semtech USP / RAC
# CONFIG_LORA is not set

# Semtech LBM drivers (RAL/RALF) + USP stack (RAC) — see usp_zephyr samples
CONFIG_LORA_BASICS_MODEM_DRIVERS=y
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_GLOBAL_THREAD=y

CONFIG_USP=y
CONFIG_USP_MAIN_THREAD=y
# 与 ping_pong sample 一样，USP 主线程单独运行；AT 线程通过互斥安全调用 RAC API。
CONFIG_USP_THREADS_MUTEXES=y
CONFIG_USP_MAIN_THREAD_STACK_SIZE=4096
CONFIG_USP_MAIN_THREAD_PRIORITY=-4

CONFIG_TEST_RANDOM_GENERATOR=y

# Match ping_pong sample libc selection.
CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

# Flash / settings (unchanged for AT+ storage commands)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
