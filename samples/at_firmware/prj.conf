CONFIG_USE_SEGGER_RTT=n

# Power measurement: disable Zephyr LOG. AT +EVT still uses rak_at UART I/O.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_ASYNC_API=y
# With PM_DEVICE=y this defaults off; enable so UARTE can gate clocks when RX is stopped.
CONFIG_UART_20_NRF_ASYNC_LOW_POWER=y

CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_NRF_GRTC_TIMER=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
CONFIG_I2C=y
CONFIG_SPI=y

CONFIG_PM_DEVICE=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_POWEROFF=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=-2
CONFIG_HEAP_MEM_POOL_SIZE=8192
# LoRaMAC TimerIrqHandler -> MacProcessNotify -> LoRaMacProcess runs here
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
# Drop debug instrumentation that adds idle overhead.
CONFIG_STACK_SENTINEL=n
CONFIG_THREAD_STACK_INFO=n
CONFIG_THREAD_MONITOR=n
CONFIG_THREAD_NAME=n
CONFIG_EXTRA_EXCEPTION_INFO=n
CONFIG_FAULT_DUMP=0

# Product firmware does not use Bluetooth.
CONFIG_BT=n

# RAK firmware framework (modules/rak-fw) + board runtime.
CONFIG_RAK_FW=y
CONFIG_RAK_FW_LORAWAN=y
CONFIG_RAK_FW_LORA_P2P=y
CONFIG_RAK_AT=y
CONFIG_RAK_AT_LORAWAN=y
CONFIG_RAK_AT_LORA_P2P=y
CONFIG_RAK_AT_UART_LP=y
# Sense wake (lower idle current). KEEP_RX≈155µA and avoids first-byte loss.
CONFIG_RAK_AT_UART_LP_KEEP_RX=n
CONFIG_RAK3162_RUNTIME=y

# Zephyr LoRa + LoRaWAN (loramac-node); default AT+BAND=4 (EU868).
# RAK3162 SX1262 is HF-only: no EU433 / CN470.
CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAMAC_REGION_EU868=y
CONFIG_LORAMAC_REGION_RU864=y
CONFIG_LORAMAC_REGION_IN865=y
CONFIG_LORAMAC_REGION_US915=y
CONFIG_LORAMAC_REGION_AU915=y
CONFIG_LORAMAC_REGION_KR920=y
CONFIG_LORAMAC_REGION_AS923=y

CONFIG_ENTROPY_GENERATOR=y

CONFIG_PICOLIBC_USE_MODULE=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
