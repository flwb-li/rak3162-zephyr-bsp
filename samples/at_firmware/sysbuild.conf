# Build MCUboot + application. First program still needs SWD (J-Link);
# later upgrades can use MCUboot serial recovery on uart20.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
# Serial recovery writes the primary slot; dual-slot DTS kept for future app DFU.
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y
