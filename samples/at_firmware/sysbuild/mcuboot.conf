# MCUboot image fragment: UART serial recovery on zephyr,uart-mcumgr (uart20).

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_MULTITHREADING=y

# Serial recovery owns the UART; do not also use it as MCUboot console.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=y
CONFIG_LOG=n

# LED0 (P2.09) on while serial recovery is active.
CONFIG_MCUBOOT_INDICATION_LED=y
